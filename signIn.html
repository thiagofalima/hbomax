<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./assets/css/reset.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/nav.css">
  <link rel="stylesheet" href="./assets/css/header.css">
  <link rel="stylesheet" href="./assets/css/footer.css">
  <link rel="stylesheet" href="./assets/css/signin.css">
  <title>Sign in</title>
</head>

<body>
  <nav class="navbar">
    <a class="navbar__logo" href="./index.html"><img src="./assets/images/hbo-logo.svg" alt="HBO Logo"
        class="navbar__logo-image"></a>
    <div class="navbar__links">
      <a href="./signIn.html" class="navbar__link login">entrar</a>
      <a href="#subscriptions" class="navbar__link sign">assine agora</a>
    </div>
  </nav>

  <section class="login__form">
    <div class="form__container">
      <h2>ENTRAR</h2>
      <form class="form">
        <p>Você tem uma conta da HBO Max?</p>
        <input class="login__field" type="email" class="email" placeholder="Endereço de e-mail">
        <input class="login__field" type="password" class="password" placeholder="Senha" minlength="8">
        <div class="login__actions">
          <button class="button" type="submit">Entrar</button>
          <a class="link" href="#">Esqueceu a senha?</a>
        </div>
      </form>
    </div>
  </section>

  <footer class="footer container">
    <div class="footer__links">
      <a href="" class="link">AGORA NA HBO MAX</a>
      <a href="" class="link">EM BREVE</a>
      <a href="" class="link">FILMES EM DESTAQUE</a>
      <a href="" class="link">SÉRIES</a>
      <a href="" class="link">AJUDA</a>
    </div>
    <p>© 2022 WarnerMedia Direct Latin America, LLC. Todos os direitos reservados. HBO Max é usado sob licença.</p>
    <div class="footer__social">
      <a href="#">
        <img src="./assets/images/fb_0.png" alt="Facebook logo">
      </a>
      <a href="#">
        <img src="./assets/images/twitter_0.png" alt="Twitter logo">
      </a>
      <a href="#">
        <img src="./assets/images/instagram_0.png" alt="Instagram logo">
      </a>
      <a href="#">
        <img src="./assets/images/youtube_0.png" alt="Youtube logo">
      </a>
    </div>
  </footer>

</body>

</html>
